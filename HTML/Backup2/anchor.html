    <!-- 
            anchor tag : it is use to create a hyperlink to another web page or to a specific section of the same web page.

            href : it is use to specify the URL of the page the link goes to.

            target : it is use to specify where to open the linked document. it can be _blank, _self, _parent, or _top.


            _blank : it opens the linked document in a new window or tab.
            
            _self : it opens the linked document in the same window or tab as it was clicked

            _parent : it opens the linked document in the parent frame.

            _top : it opens the linked document in the full body of the window.

    -->
