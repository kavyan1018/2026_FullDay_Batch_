<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- 
        List tags : it is used to create list in html

        ol : ordered list (numbered list)
        ul : unordered list (bulleted list)
        li : list item
    -->

    <h1>My List</h1>

    <!-- unordered list -->
    <!-- <ul> -->
    <!-- <ul type="square"> -->
    <ul type="circle">
        <li>Pizza</li>
        <li>Burger</li>
        <li>Pasta</li>
    </ul>


    <!-- ordered list -->
    <!-- by default it is numbered list -->
    
    <!-- <ol> -->
    <!-- <ol type="1"> -->
    <!-- <ol type="A"> -->
    <!-- <ol type="a"> -->
    <!-- <ol type="I"> -->
    <ol type="i" reversed start="5">
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
        <li>Fourth Item</li>
        <li>Fifth Item</li>
        <li>Sixth Item</li>
        <li>Seventh Item</li>
    </ol>


</body>
</html>
