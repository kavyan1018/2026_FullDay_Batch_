<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- 
        table : data formatting
        tr : table row
        td : table data
        th : table header

        thead : table header
        tbody : table body
    
        cellpadding : space between cell content and cell border
        cellspacing : space between cells
    
        rowspan : number of rows a cell should span
        colspan : number of columns a cell should span
        -->

    <table border="2" >
    <!-- <table border="2" bgcolor="lightblue"> -->
    <!-- <table border="2" bordercolor="red"> -->
    <!-- <table border="2" cellpadding="10"> -->
    <!-- <table border="2" cellspacing="10"> -->
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        <tr>
            <td>Mihir</td>
            <td rowspan="2">25</td>
            <td>New York</td>
        </tr>

        <tr>
            <td>Riya</td>
            <!-- <td>30</td> -->
            <td>Los Angeles</td>
        </tr>

        <tr align="center">
            <td>Arjun</td>
            <td colspan="2" bgcolor="red">28</td>
            <!-- <td>Chicago</td> -->
        </tr>

    </table>

</body>

</html>
