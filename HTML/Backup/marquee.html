<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- 
        marquee : 
            it is use to create a scrolling text or image within a web page.

        behavior :
            scroll : it is default value. It scrolls the content from one end to another end.
            slide : it slides the content in one direction and stops at the end.
            alternate : it bounces the content back and forth between the two ends.

        direction :
            left : it scrolls the content from right to left.
            right : it scrolls the content from left to right.
            up : it scrolls the content from bottom to top.
            down : it scrolls the content from top to bottom.

        scrollamount : it is used to set the speed of the scrolling content. 



    -->
    
    <!-- <marquee behavior="" direction="right" scrollamount="15"> -->
    <!-- <marquee behavior="" direction="left" scrollamount="15" width="500px"> -->
    <!-- <marquee behavior="" direction="up" scrollamount="15"> -->
    <!-- <marquee behavior="slide" direction="down" scrollamount="15" height="400px" loop="3">  -->
    <!-- <marquee behavior="scroll" direction="down" scrollamount="15" height="400px" loop="3">  -->
    <!-- <marquee behavior="scroll" direction="down" scrollamount="15" height="400px" loop="3">  -->
    <marquee behavior="alternate" direction="down" scrollamount="15" height="400px"> 

        <!-- <h1>this is a marquee tag</h1> -->

        <img src="/HTML/image.png" alt="" height="200px">

    </marquee>

</body>
</html>
